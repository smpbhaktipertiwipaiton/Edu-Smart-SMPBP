<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>

  <title>Edu-Smart SMP BHAKTI PERTIWI</title>

  <!-- ICON -->
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-512.png" />

  <!-- ===== PWA META TAGS ===== -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="msapplication-TileColor" content="#4f46e5" />

  <!-- iOS Safari Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SI-LMS" />
  <meta name="application-name" content="SI-LMS" />
  <!-- ========================== -->

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      overflow: hidden;
    }
    .iframe-container {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Tombol Install PWA */
    #btn-install {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      right: 12px;
      z-index: 9999;
      background: #10b981;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      font-family: system-ui, sans-serif;
      box-shadow: 0 6px 20px rgba(16,185,129,0.4);
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      transition: transform .15s ease;
    }
    #btn-install:active { transform: scale(0.95); }
    #btn-install svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <button id="btn-install">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 20h14v-2H5v2zM12 2l5.5 5.5-1.41 1.41L13 5.83V16h-2V5.83L7.91 8.91 6.5 7.5 12 2z"/></svg>
    Install App
  </button>

  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbzzwToXs17_irYjSEH--110cS-uZgPkIgNje7TXRWEH376PUlyLc0Mz4bKE3LN8dhhw/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>

  <script>
    // ===== PWA: Register Service Worker =====
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function(err) { console.warn('[PWA] SW failed:', err); });
      });
    }

    // ===== PWA: Install Prompt =====
    let deferredPrompt = null;
    const btnInstall = document.getElementById('btn-install');

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.style.display = 'flex';
      console.log('[PWA] Install prompt ready');
    });

    btnInstall.addEventListener('click', function() {
      if (!deferredPrompt) {
        // Fallback: tampilkan instruksi manual
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        if (isIOS) {
          alert('iOS Safari:\n1. Tap tombol Share (⎋)\n2. Pilih "Add to Home Screen"');
        } else {
          alert('Chrome Android:\n1. Tap menu ⋮\n2. Pilih "Install app" / "Add to Home screen"');
        }
        return;
      }
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(choice) {
        if (choice.outcome === 'accepted') {
          console.log('[PWA] User installed');
        }
        deferredPrompt = null;
        btnInstall.style.display = 'none';
      });
    });

    window.addEventListener('appinstalled', function() {
      console.log('[PWA] App installed');
      btnInstall.style.display = 'none';
    });
  </script>
</body>
</html>
